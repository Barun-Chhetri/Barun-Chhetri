<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="p2-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="card-border-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.1"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Container -->
  <rect width="850" height="250" rx="14" fill="url(#p2-bg)"/>
  <rect x="1" y="1" width="848" height="248" rx="13" fill="none" stroke="url(#card-border-2)" stroke-width="1.5"/>

  <!-- Top bar -->
  <g transform="translate(25, 24)">
    <rect width="90" height="22" rx="11" fill="#581C87" fill-opacity="0.3" stroke="#A855F7" stroke-width="1"/>
    <text x="45" y="15" fill="#C084FC" font-size="10.5" font-weight="700" text-anchor="middle" class="mono">FEATURED</text>

    <text x="105" y="16" fill="#F8FAFC" font-size="17" font-weight="700" class="sans">
      180-Day Interview Prep Tracker
    </text>

    <!-- Live indicator -->
    <g transform="translate(640, 2)">
      <circle cx="0" cy="10" r="4" fill="#10B981"/>
      <text x="12" y="14" fill="#10B981" font-size="11" font-weight="600" class="mono">LIVE PRODUCTION</text>
    </g>
  </g>

  <!-- Dashboard Metrics Panels -->
  <g transform="translate(25, 62)">
    <!-- Metric 1: Tasks -->
    <rect x="0" y="0" width="180" height="64" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="15" y="24" fill="#C084FC" font-size="11" font-weight="700" class="mono">CURRICULUM</text>
    <text x="15" y="47" fill="#F1F5F9" font-size="20" font-weight="800" class="sans">900 Tasks</text>
    <text x="15" y="58" fill="#64748B" font-size="9" class="mono">Spaced-Repetition Active</text>

    <!-- Metric 2: Review Intervals -->
    <rect x="200" y="0" width="185" height="64" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="15" y="24" transform="translate(200,0)" fill="#38BDF8" font-size="11" font-weight="700" class="mono">RETENTION ENGINE</text>
    <text x="15" y="47" transform="translate(200,0)" fill="#F1F5F9" font-size="20" font-weight="800" class="sans">965 Intervals</text>
    <text x="15" y="58" transform="translate(200,0)" fill="#64748B" font-size="9" class="mono">Cognitive Decay Spacing</text>

    <!-- Metric 3: State & Time -->
    <rect x="405" y="0" width="195" height="64" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="15" y="24" transform="translate(405,0)" fill="#F472B6" font-size="11" font-weight="700" class="mono">STATE ENGINE</text>
    <text x="15" y="47" transform="translate(405,0)" fill="#F1F5F9" font-size="19" font-weight="800" class="sans">Atomic Tx + Timer</text>
    <text x="15" y="58" transform="translate(405,0)" fill="#64748B" font-size="9" class="mono">Rollback &amp; Carryover</text>

    <!-- Metric 4: Auth & Security -->
    <rect x="620" y="0" width="180" height="64" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1"/>
    <text x="15" y="24" transform="translate(620,0)" fill="#34D399" font-size="11" font-weight="700" class="mono">SECURITY &amp; TESTS</text>
    <text x="15" y="47" transform="translate(620,0)" fill="#F1F5F9" font-size="18" font-weight="800" class="sans">JWT + Vitest</text>
    <text x="15" y="58" transform="translate(620,0)" fill="#64748B" font-size="9" class="mono">BCrypt &amp; Unit Coverage</text>
  </g>

  <!-- Technical Spec & Stack Pills -->
  <g transform="translate(25, 145)">
    <text x="0" y="16" fill="#CBD5E1" font-size="12" class="sans">
      <tspan fill="#C084FC" font-weight="700">Modern Architecture:</tspan> Next.js 16 • React 19 • TypeScript • Prisma ORM • PostgreSQL • Docker • Tailwind CSS
    </text>
    <text x="0" y="38" fill="#94A3B8" font-size="11.5" class="sans">
      Built with robust transaction handling, daily/weekly progress analytics, study timer persistence, and zero-data-loss carryover.
    </text>
  </g>

  <!-- Bottom Badges / Metrics -->
  <g transform="translate(25, 205)">
    <rect width="135" height="26" rx="6" fill="#1E293B"/>
    <text x="67" y="17" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle" class="mono">Next.js 16 + React 19</text>

    <rect x="145" y="0" width="125" height="26" rx="6" fill="#1E293B"/>
    <text x="207" y="17" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle" class="mono">Prisma + Postgres</text>

    <rect x="280" y="0" width="135" height="26" rx="6" fill="#1E293B"/>
    <text x="347" y="17" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle" class="mono">JWT &amp; BCrypt Auth</text>

    <rect x="425" y="0" width="130" height="26" rx="6" fill="#1E293B"/>
    <text x="490" y="17" fill="#E2E8F0" font-size="11" font-weight="600" text-anchor="middle" class="mono">Vitest Test Suite</text>

    <rect x="565" y="0" width="235" height="26" rx="6" fill="#3B0764" stroke="#9333EA" stroke-width="1"/>
    <text x="682" y="17" fill="#E9D5FF" font-size="11" font-weight="700" text-anchor="middle" class="mono">🔗 interview-crack.barunchamlagain.me</text>
  </g>
</svg>
